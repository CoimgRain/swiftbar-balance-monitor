<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SwiftBar balance monitor demo</title>
  <desc id="desc">A sanitized demo of a macOS menu bar dropdown showing balance and subscription usage.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8f96"/>
      <stop offset="0.45" stop-color="#686b73"/>
      <stop offset="1" stop-color="#22242b"/>
    </linearGradient>
    <linearGradient id="menu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303136"/>
      <stop offset="1" stop-color="#1f2026"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#wall)"/>
  <path d="M0 360 L280 280 L480 340 L760 245 L1200 180 L1200 720 L0 720 Z" fill="#14151a" opacity="0.82"/>
  <path d="M0 360 L280 280 L480 340 L760 245 L1200 180" fill="none" stroke="#a7a9af" stroke-opacity="0.22" stroke-width="8"/>
  <rect y="0" width="1200" height="58" fill="#777981" opacity="0.92"/>

  <rect x="170" y="10" width="330" height="44" rx="22" fill="#a2a3aa" opacity="0.42"/>
  <text x="205" y="40" fill="#f6f6f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">Ex $50.20 / 订86.4%</text>
  <text x="535" y="40" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">Alt ¥8.09</text>
  <text x="720" y="40" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">☾ 24°C</text>
  <text x="900" y="40" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">CPU 67°</text>

  <rect x="158" y="72" width="820" height="602" rx="26" fill="url(#menu)" stroke="#777a82" stroke-width="2" filter="url(#shadow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#e9e9ed">
    <text x="198" y="124">Current balance: $50.20</text>
    <text x="198" y="182">Subscription used: $259.12 / $300.00 (86.4%)</text>
    <text x="198" y="240">Subscription remain: $40.88 / $300.00 (13.6%)</text>
    <text x="198" y="298">Plan: used 72.7% · $109.12 / $150.00</text>
    <text x="198" y="356">Plan: used 100.0% · $150.00 / $150.00</text>
    <text x="198" y="414">Account: DEMO</text>
    <text x="198" y="472">Updated: 2026-01-01 12:00:00</text>
  </g>

  <line x1="198" y1="504" x2="938" y2="504" stroke="#5d6069" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#ededf1">
    <text x="198" y="558">Display</text>
    <text x="198" y="618">✓ Used percentage</text>
    <text x="198" y="672">○ Remaining percentage</text>
  </g>
</svg>
